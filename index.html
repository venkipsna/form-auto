
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Details Form</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #f0f3f8;
            font-family: Arial, sans-serif;
        }

        .form-container {
            max-width: 650px;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            color: #174a7e;
            margin-bottom: 25px;
        }

        .form-label {
            font-weight: 600;
        }

        .btn-submit {
            background: #174a7e;
            color: white;
        }

        .btn-submit:hover {
            background: #10365d;
            color: white;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="form-container">
        <h2>Personal Details Form</h2>

        <form id="detailsForm">

            <div class="row mb-3">
                <div class="col-md-4">
                    <label class="form-label" for="title">Title</label>
                    <select class="form-select" id="title" required>
                        <option value="">Select</option>
                        <option>Mr.</option>
                        <option>Ms.</option>
                        <option>Mrs.</option>
                        <option>Dr.</option>
                    </select>
                </div>

                <div class="col-md-4">
                    <label class="form-label" for="initial">Initial</label>
                    <input type="text" class="form-control" id="initial"
                           placeholder="e.g. R." maxlength="10" required>
                </div>

                <div class="col-md-4">
                    <label class="form-label" for="name">Name</label>
                    <input type="text" class="form-control" id="name"
                           placeholder="Enter name" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label" for="mobile">Mobile Number</label>
                <input type="tel" class="form-control" id="mobile"
                       placeholder="10-digit mobile number"
                       pattern="[6-9][0-9]{9}"
                       maxlength="10" required>
            </div>

            <div class="mb-3">
                <label class="form-label" for="address">Address</label>
                <textarea class="form-control" id="address" rows="3"
                          placeholder="Enter your address" required></textarea>
            </div>

            <div class="mb-3">
                <label class="form-label" for="degree">Degree</label>
                <select class="form-select" id="degree" required>
                    <option value="">Select Degree</option>
                    <option>10th</option>
                    <option>12th</option>
                    <option>Diploma</option>
                    <option>BA</option>
                    <option>BSc</option>
                    <option>BCom</option>
                    <option>BE</option>
                    <option>BTech</option>
                    <option>MA</option>
                    <option>MSc</option>
                    <option>MCom</option>
                    <option>ME</option>
                    <option>MTech</option>
                    <option>MBA</option>
                    <option>MCA</option>
                    <option>PhD</option>
                    <option>Other</option>
                </select>
            </div>

            <div class="mb-4">
                <label class="form-label" for="percentage">
                    Percentage (%)
                </label>
                <input type="number" class="form-control" id="percentage"
                       placeholder="Enter percentage"
                       min="0" max="100" step="0.01" required>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-submit w-100">
                    Submit
                </button>
                <button type="reset" class="btn btn-secondary w-100">
                    Reset
                </button>
            </div>

            <div id="message" class="mt-3 text-success"></div>

        </form>
    </div>
</div>

<script>
    document.getElementById("detailsForm").addEventListener("submit", function(event) {
        event.preventDefault();

        const data = {
            title: document.getElementById("title").value,
            initial: document.getElementById("initial").value.trim(),
            name: document.getElementById("name").value.trim(),
            mobile: document.getElementById("mobile").value,
            address: document.getElementById("address").value.trim(),
            degree: document.getElementById("degree").value,
            percentage: document.getElementById("percentage").value
        };

        document.getElementById("message").textContent =
            "Form validated successfully! " +
            "Name: " + data.title + " " + data.initial + " " + data.name;
    });
</script>

</body>
</html>
